name: HROne Attendance

on:
  schedule:
    - cron: '0 0 * * *'    # 9:30 AM IST
    - cron: '0 9 * * *'   # 6:30 PM IST
  workflow_dispatch:
    inputs:
      punch_time:
        description: 'Override punch time (YYYY-MM-DDTHH:MM, IST)'
        required: false

jobs:
  mark-attendance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run attendance script
        env:
          HRONE_USERNAME: ${{ secrets.HRONE_USERNAME }}
          HRONE_PASSWORD: ${{ secrets.HRONE_PASSWORD }}
          EMPLOYEE_ID: ${{ secrets.EMPLOYEE_ID }}
          PUNCH_TIME: ${{ inputs.punch_time }}
        run: python main.py